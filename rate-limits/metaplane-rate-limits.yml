description: Rate limiting posture for the Metaplane REST API, read from the provider's own published documentation.
limit_count: 0
note: 'Metaplane publishes NO rate limits. The complete docs index at docs.metaplane.dev/llms.txt has no rate-limit,
  throttling or quota page; the API getting-started page covers authentication only; and the published OpenAPI declares
  no 429 response and no RateLimit/Retry-After header on any of its 23 operations. This artifact previously carried
  invented per-tier numbers (10/min free, 100/min pro, 1000/min enterprise) written by a 2026-05-04 bulk sweep —
  those were fabricated and have been removed. An honest zero is the measurement. The only published request ceiling
  of any kind is a per-request payload cap: bulkGetTableMonitors accepts at most 200 table paths.'
