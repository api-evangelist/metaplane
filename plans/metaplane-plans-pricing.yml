specification: API Commons Plans
specificationVersion: '0.1'
provider: Metaplane
providerId: metaplane
generated: '2026-08-29'
method: searched
source: https://www.metaplane.dev/pricing
created: '2026-05-04'
modified: '2026-08-29'
description: Metaplane's published plans, read verbatim from the pricing page on 2026-08-29. Replaces a 2026-05-04
  bulk-sweep scaffold whose tiers, quotas and overage prices were invented.
currency: USD
billing_unit: monitored table
plan_count: 3
note: 'Metaplane prices the PRODUCT, not the API — no plan meters API calls and no tier gates access to the REST
  API by request volume. The API-relevant gate is on the alerting side: the pricing comparison table lists ''API,
  Webhooks'' as alert destinations on ENTERPRISE only, while Free and Pro get Slack/Email/MS Teams (Pro adds PagerDuty).
  Pro pricing is usage-based per monitored table and the per-table rate is not published; Enterprise is contact-sales.
  Snowflake customers may pay with existing Snowflake credits.'
plans:
- id: metaplane-free
  name: Free
  type: freemium
  price: '0.00'
  currency: USD
  period: month
  cta: Start for free — no credit card required, choose your plan after 14 days
  limits:
  - name: monitored_tables
    limit: 10
  - name: custom_sql_monitors
    limit: 3
  - name: users
    limit: 4
    note: The plan card says 4 users; the comparison table row 'Number of users' says 1. The provider's own page
      disagrees with itself — recorded as published, not reconciled.
  elements:
  - Monitoring and anomaly detection
  - Manual thresholds
  - Alerting to Slack, Email, MS Teams
  - 'Warehouse connectors: Snowflake, BigQuery, Redshift, Clickhouse, Postgres, MySQL, SQL Server, Databricks'
  - dbt transformation integration
  - 'BI: Looker, Tableau, Metabase, Mode, Sigma, PowerBI'
  - 'Monitor types: volume, schema, freshness, uniqueness, nullness, statistical distribution, custom SQL'
  - SOC 2, GDPR, HIPAA
  - Email support
- id: metaplane-pro
  name: Pro
  type: usage-based
  price: null
  currency: USD
  period: month
  price_note: '''Usage-based — pay for what you use'', priced per monitored table. The per-table rate is NOT published
    on the pricing page.'
  limits:
  - name: monitored_tables
    limit: 100
  - name: custom_sql_monitors
    limit: 5
  - name: users
    limit: 12
    note: 'Plan card: 12 users, unlimited viewers. Comparison table row says 5.'
  elements:
  - Everything in Free
  - Column-level lineage
  - Data CI/CD
  - Cost & performance monitoring
  - Data insights
  - Partition monitors
  - Rolling window monitors
  - dbt job monitoring
  - Query monitoring
  - Alerting adds PagerDuty
  - Email support
  addons:
  - Data Impact Previews
  - Data Test Previews
  - Warehouse Spend Monitoring / Credit and Spend Monitoring
- id: metaplane-enterprise
  name: Enterprise
  type: enterprise
  price: custom
  currency: USD
  period: custom
  cta: Contact sales
  limits:
  - name: monitored_tables
    limit: -1
    note: Unlimited
  - name: custom_sql_monitors
    limit: 10
  - name: users
    limit: -1
    note: 12+ users, unlimited viewers
  elements:
  - Everything in Pro
  - Custom integrations
  - SSO — Okta, AD, SAML
  - AWS or Azure PrivateLink support
  - Alert destinations add API and Webhooks
  - Premium support, shared Slack channel, CSM and engineering time
payment_options:
- name: Snowflake credits
  note: '''Use Snowflake? Pay with your existing Snowflake credits.'' — https://www.metaplane.dev/pricing'
