aid: metaplane
name: Metaplane
description: >-
  Metaplane is a data observability platform for data teams — automated anomaly detection, data quality
  monitoring, column-level lineage, schema-change alerting and data CI/CD across Snowflake, BigQuery,
  Redshift, Databricks, ClickHouse, Postgres, MySQL, SQL Server, S3, dbt, Airflow and the major BI tools.
  Metaplane learns the normal behaviour of every monitored table with an ML model and raises grouped
  incidents when volume, freshness, nullness, uniqueness, cardinality or a custom SQL metric drifts out
  of bounds. It exposes a REST API of 23 operations over connections, monitors, monitor evaluations,
  datapoint ingestion and tags, documented on a ReadMe developer portal, plus outbound incident webhooks
  and a free local CLI for visualising dbt runs. Metaplane was acquired by Datadog in April 2025 and
  continues to operate as a standalone product surface.
