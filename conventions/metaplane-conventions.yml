auth:
  style: bearer token in the Authorization header
  header: 'Authorization: Bearer <YOUR_SECRET_API_TOKEN>'
  issuance: https://app.metaplane.dev/account/manage-tokens — token value is shown once at creation
  spec_declaration: components.securitySchemes.Authorization — type apiKey, in header, name Authorization
  note: The spec models it as an apiKey rather than http/bearer, so a generator reading only the contract will emit
    a raw header value and omit the 'Bearer ' prefix the docs require.
  see: authentication/metaplane-authentication.yml
idempotency:
  supported: false
  header: null
  note: No Idempotency-Key header, no idempotency guidance in the docs, and no idempotency parameter on any of the
    16 write operations. Retrying createMonitor after a timeout will create a second monitor.
pagination:
  styles:
  - name: opaque cursor
    operations:
    - fetchTaggedObjects
    request:
      nextPageToken: query, string, omit for first page
    response:
      data: array of PublicEntity
      nextPageToken: string, nullable
      hasMore: boolean
  - name: timestamp cursor
    operations:
    - getEvaluationHistory
    request:
      createdAt: body, date-time — leave empty to start at the most recent evaluation
      limit: body, int32, default 500, max 500
      sortOrder: body, ASC|DESC, default DESC
    response: bare array of MonitorStatus ordered by evaluation creation time
  unpaginated:
  - getAllConnections
  - getAllMonitorsForSource
  - fetchTaggedMonitors
  - getMonitors
  note: Two different pagination contracts inside one 23-operation API, and the majority of collection endpoints
    return an unbounded array with no paging parameters at all.
