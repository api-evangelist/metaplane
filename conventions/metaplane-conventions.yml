content_type: application/json
scheduling:
  note: Monitors carry a cronTab string and MonitorConfig.timeZone; schedules are part of the resource, not a separate
    API.
reversibility:
  grade: documented
  write_surface: true
  note: Metaplane's write surface has genuine, first-class reversal paths — the tag operations come in explicit
    apply/remove pairs and monitors carry an isEnabled flag — but the docs state NO window for any of them, and
    no operation returns or accepts a Sunset/expiry. Graded `documented` (reversal path exists) rather than `verified`
    (path plus a stated window). No window is asserted here that the provider does not publish.
  surfaces:
  - action: Create a monitor
    operationId: createMonitor
    method: POST
    path: /v1/monitors
    reversal:
      type: disable
      operationId: updateMonitor
      method: POST
      path: /v1/monitors/{monitorId}
      how: 'POST the monitor with isEnabled: false'
      window: null
      note: Reversal is a disable, not a delete — the published API exposes no monitor delete operation at all,
        so a monitor created in error can be switched off but not removed through the API.
    grade: documented
  - action: Tag tables
    operationId: tagTables
    method: POST
    path: /v1/tags/batch/tag-tables
    reversal:
      type: remove
      operationId: removeTableTags
      method: POST
      path: /v1/tags/remove-table-tags
      window: null
    grade: documented
  - action: Tag monitors
    operationId: tagMonitors
    method: POST
    path: /v1/tags/batch/tag-monitors
    reversal:
      type: remove
      operationId: removeMonitorTags
      method: POST
      path: /v1/tags/remove-monitor-tags
      window: null
    grade: documented
  - action: Import historic observations
    operationId: importHistoricDataForMonitor
    method: POST
    path: /v1/monitors/import-historic/{monitorId}
    reversal:
      type: none
      note: No un-import operation is published. The request body does carry an isPreview flag which validates the
        import without inserting data — that is a dry-run, not a reversal.
      window: null
    grade: none
  - action: Ingest a datapoint
    operationId: ingestDataPoint
    method: POST
    path: /v1/monitors/ingest-datapoint/{monitorId}
    reversal:
      type: none
      window: null
      note: No delete or retract operation. Private beta per the docs.
    grade: none
  - action: Update a connection private key
    operationId: updatePrivateKey
    method: POST
    path: /v1/connections/{connectionId}/update-private-key
    reversal:
      type: overwrite
      note: Reversible only by posting the previous key again; the API returns no prior value, so the caller must
        hold it.
      window: null
    grade: documented
  - action: Run monitors
    operationId: runMonitors
    method: POST
    path: /v1/monitors/run
    reversal:
      type: none
      note: Enqueues an evaluation; no cancel operation is published.
      window: null
    grade: none
dry_run_mode:
  supported: true
  scope: partial
  note: 'importHistoricDataForMonitor accepts isPreview: true to validate an import without inserting data (https://docs.metaplane.dev/docs/importing-historical-data).
    No other write operation offers a dry run.'
