openapi: 3.0.1
info:
  title: Metaplane Api
  description: MetaplanePublicApi API description
  version: '1.0'
  contact:
    name: Metaplane
    url: https://docs.metaplane.dev/reference/getting-started
servers:
- url: https://dev.api.metaplane.dev
security:
- Authorization: []
tags:
- name: Connections
- name: Monitors
- name: Tags
paths:
  /v2/monitors/bulk-fetch/tables/{connectionId}:
    post:
      tags:
      - Monitors
      summary: Bulk get monitors on tables
      description: Get all monitors on the input table paths. Limit of 200 table paths per request.
      operationId: bulkGetTableMonitors
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: includeDisabled
        in: query
        schema:
          type: boolean
      - name: fetchGroups
        in: query
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkFetchMonitorTablesRequest'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorListResult'
  /v1/monitors:
    post:
      tags:
      - Monitors
      summary: Create Monitor
      description: Create a new monitor on a given absolute path like "{database}.{schema}.{table}.{column}"
      operationId: createMonitor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorEgg'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMonitor'
  /v1/tags/batch/fetch-tags:
    post:
      tags:
      - Tags
      summary: Batch fetch tag definitions
      description: Fetch the Metaplane definition for the given tag name. POST is just for a more expressive request body,
        no mutation occurs
      operationId: fetchTagDefinitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDefinitionRequest'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicTagDefinition'
  /v1/tags/tagged-monitors/{tag}:
    get:
      tags:
      - Tags
      summary: Fetch monitors for a tag
      description: Fetch all monitors associated with a tag
      operationId: fetchTaggedMonitors
      parameters:
      - name: tag
        in: path
        required: true
        schema:
          type: string
      - name: includeDisabled
        in: query
        schema:
          type: boolean
      - name: fetchGroups
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicMonitor'
  /v1/tags/tagged-objects/{tag}:
    get:
      tags:
      - Tags
      summary: Fetch all objects for tag
      description: Fetches all objects that have the target tag. This response is paginated
      operationId: fetchTaggedObjects
      parameters:
      - name: tag
        in: path
        required: true
        schema:
          type: string
      - name: nextPageToken
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggedObjectResponse'
  /v1/connections:
    get:
      tags:
      - Connections
      summary: List all
      description: List all connections
      operationId: getAllConnections
      parameters:
      - name: includeDeleted
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
  /v1/monitors/connection/{connectionId}:
    get:
      tags:
      - Monitors
      summary: List for connection
      description: List all monitors for a specific connection
      operationId: getAllMonitorsForSource
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: includeDisabled
        in: query
        schema:
          type: boolean
      - name: fetchGroups
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorListResult'
  /v1/connections/{connectionId}/sync/status:
    get:
      tags:
      - Connections
      summary: Sync status
      description: Get the current sync status of a connection
      operationId: getConnectionStatus
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionSyncStatusResult'
  /v1/monitors/evaluation-history/{monitorId}:
    post:
      tags:
      - Monitors
      summary: Evaluation History
      description: Get historical evaluations of the monitor ordered by evaluation creation time descending. By default this
        will return pages of 500 evaluations. To page through all data, specify the `createdAt` request to get the next chunk
        of data. Even though this is a post request, no data is mutated.
      operationId: getEvaluationHistory
      parameters:
      - name: monitorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationHistoryRequest'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitorStatus'
  /v1/monitors/{monitorId}:
    get:
      tags:
      - Monitors
      summary: Get monitor
      description: Fetch an existing monitor
      operationId: getMonitor
      parameters:
      - name: monitorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fetchGroups
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMonitor'
    post:
      tags:
      - Monitors
      summary: Update monitor
      description: Update an existing monitor. Omitted update fields will not be change in the underlying monitor
      operationId: updateMonitor
      parameters:
      - name: monitorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorUpdate'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMonitor'
  /v1/monitors/path/{connectionId}/{absolutePath}:
    get:
      tags:
      - Monitors
      summary: Get for database entity
      description: Get all monitors targeting a specific absolute path like "{database}.{schema}.{table}.{column}"
      operationId: getMonitors
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: absolutePath
        in: path
        required: true
        schema:
          type: string
      - name: entityType
        in: query
        schema:
          type: string
          enum:
          - TABLE
          - COLUMN
          - DATABASE
          - SCHEMA
      - name: includeDisabled
        in: query
        schema:
          type: boolean
      - name: fetchGroups
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorListResult'
  /v1/monitors/status/{monitorId}:
    get:
      tags:
      - Monitors
      summary: Status (deprecated)
      description: Get the latest status of a monitor. Will return a 404 if the monitor has not yet been run and modeled
      operationId: getMonitorStatus
      parameters:
      - name: monitorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorStatus'
  /v2/monitors/status/{monitorId}:
    get:
      tags:
      - Monitors
      summary: Status
      description: Get the latest status of a monitor. Will return a 404 if the monitor has not yet been run and modeled
      operationId: getMonitorStatus2
      parameters:
      - name: monitorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorStatusResultV2'
  /v1/monitors/import-historic/{monitorId}:
    post:
      tags:
      - Monitors
      summary: Import Historic Data
      description: Import historic data for the monitor. Full documentation at https://docs.metaplane.dev/docs/importing-historical-data#limitations.
        Setting `isPreview` to  true will validate the import without actually inserting data.
      operationId: importHistoricDataForMonitor
      parameters:
      - name: monitorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportHistoricDataRequest'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicImportResult'
  /v1/monitors/ingest-datapoint/{monitorId}:
    post:
      tags:
      - Monitors
      summary: Ingest Datapoint
      description: Sends a datapoint to add to the target monitorId with the current timestamp and then modeled. In private
        Beta, reach out for access.
      operationId: ingestDataPoint
      parameters:
      - name: monitorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicSeriesPoint'
        required: false
      responses:
        '200':
          description: Success
  /v1/tags/remove-monitor-tags:
    post:
      tags:
      - Tags
      summary: Remove monitor tags
      description: Removes specified tags from a monitor
      operationId: removeMonitorTags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveMonitorTagsRequest'
        required: false
      responses:
        '200':
          description: Success
  /v1/tags/remove-table-tags:
    post:
      tags:
      - Tags
      summary: Remove table tags
      description: Remove specified tags from the table at "{database}.{schema}.{table}"
      operationId: removeTableTags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveTableTagsRequest'
        required: false
      responses:
        '200':
          description: Success
  /v1/monitors/run:
    post:
      tags:
      - Monitors
      summary: Run
      description: Enqueue a list of existing monitors to be immediately run. Note that a success here just means that we
        have enqueued the monitors to be run, not that they have finished running
      operationId: runMonitors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunMonitorsRequest'
        required: false
      responses:
        '200':
          description: Success
  /v1/connections/{connectionId}/sync:
    post:
      tags:
      - Connections
      summary: Sync
      description: Kicks of a task to re-sync the connection. Please note that this method returning 200 does not means the
        connection has finished syncing. You can poll the connection status api to determine when the sync has finished
      operationId: syncConnection
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
  /v1/tags/batch/tag-monitors:
    post:
      tags:
      - Tags
      summary: Batch tag monitors
      description: Apply a tag to a collection of monitors
      operationId: tagMonitors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagMonitorsRequest'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagMonitorsResult'
  /v1/tags/batch/tag-tables:
    post:
      tags:
      - Tags
      summary: Batch tag tables
      description: Apply a tag to a collection of tables identified by absolute paths like "{database}.{schema}.{table}"
      operationId: tagTables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagTablesRequest'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagTablesResult'
  /v1/connections/{connectionId}/update-private-key:
    post:
      tags:
      - Connections
      summary: Update private key
      description: Updates the private key for a connection to the newly passed in value.
      operationId: updatePrivateKey
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrivateKeyRequest'
        required: false
      responses:
        '200':
          description: Success
components:
  schemas:
    PublicAnomalyAlertRule:
      type: object
      properties:
        sensitivity:
          type: number
          description: 'Control the bounds of the model. The default value is 3.0.

            0.3 high is the highest sensitivity correlating with smallest bounds.

            6.0 Is lowest sensitivity corresponding with the largest bounds.

            '
          format: double
          default: 3
        monitorTypeOverride:
          type: string
          enum:
          - ROW_COUNT
          - COLUMN_COUNT
          - CARDINALITY
          - UNIQUENESS
          - NULLNESS
          - PERCENT_ZERO
          - PERCENT_NEGATIVE
          - MIN
          - MAX
          - MEAN
          - STDDEV
          - FRESHNESS
          - CUSTOM
          - PUSH
          - SUM
          - DURATION
          - GENERIC_OBJECT
        modelClassType:
          type: string
          enum:
          - STATIONARY
          - NONE
        modelBoundsOverride:
          type: string
          description: Flags to completely override part of the model bounds
          nullable: true
          enum:
          - UPPER_ONLY
          - LOWER_ONLY
        minLowerBoundSize:
          type: number
          description: 'Controls the minimum size for the lower bound of the models predictive range

            '
          format: double
          nullable: true
          default: 3
        minUpperBoundSize:
          type: number
          description: 'Controls the minimum size for the upper bound of the models predictive range

            '
          format: double
          nullable: true
          default: 3
    PublicMonitor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - ROW_COUNT
          - COLUMN_COUNT
          - CARDINALITY
          - UNIQUENESS
          - NULLNESS
          - PERCENT_ZERO
          - PERCENT_NEGATIVE
          - MIN
          - MAX
          - MEAN
          - STDDEV
          - FRESHNESS
          - CUSTOM
          - PUSH
          - SUM
          - DURATION
          - GENERIC_OBJECT
        genericObjectSubtype:
          type: string
        valueType:
          type: string
          enum:
          - METRIC
          - SOURCE_TO_TARGET
        cronTab:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        isEnabled:
          type: boolean
        config:
          $ref: '#/components/schemas/MonitorConfig'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        absolutePath:
          type: string
        entityType:
          type: string
        connectionId:
          type: string
          format: uuid
        monitorTags:
          uniqueItems: true
          type: array
          items:
            type: string
        monitorGroups:
          type: array
          description: List of all groups that have seen at least one datapoint for this monitor
          nullable: true
          items:
            $ref: '#/components/schemas/MonitorGrouping'
    MonitorGrouping:
      type: object
      properties:
        groupings:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/LabelNameValue'
      description: List of all groups that have seen at least one datapoint for this monitor
      nullable: true
    LabelNameValue:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
    TimeDuration:
      type: object
      properties:
        days:
          type: integer
          format: int64
        hours:
          type: integer
          format: int64
        minutes:
          type: integer
          format: int64
    MonitorListResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicMonitor'
    PublicIncrementalClause:
      type: object
      properties:
        columnName:
          type: string
        duration:
          $ref: '#/components/schemas/TimeDuration'
      nullable: true
    PublicManualThreshold:
      type: object
      properties:
        operatorType:
          type: string
          enum:
          - GREATER_THAN
          - GREATER_THAN_EQUALS
          - LESS_THAN
          - LESS_THAN_EQUALS
          - EQUAL
          - NOT_EQUAL
        value:
          type: number
          format: double
    PublicAlertRule:
      type: object
      properties:
        type:
          type: string
          enum:
          - ANOMALY
          - MANUAL
        numFailuresBeforeAlert:
          type: integer
          description: Number of time a monitor can fail before an incident is created
          format: int32
          nullable: true
      description: Optional alert rule configuration. Defaults to ANOMALY
      nullable: true
      discriminator:
        propertyName: type
        mapping:
          MANUAL: '#/components/schemas/PublicManualThresholdRule'
          ANOMALY: '#/components/schemas/PublicAnomalyAlertRule'
      oneOf:
      - $ref: '#/components/schemas/PublicAnomalyAlertRule'
      - $ref: '#/components/schemas/PublicManualThresholdRule'
    BulkFetchMonitorTablesRequest:
      type: object
      properties:
        tablePaths:
          uniqueItems: true
          type: array
          description: 'Set of table path string in format of: {database}.{schema}.{table}'
          items:
            type: string
            description: 'Set of table path string in format of: {database}.{schema}.{table}'
    PublicManualThresholdRule:
      type: object
      properties:
        thresholds:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/PublicManualThreshold'
    MonitorConfig:
      type: object
      properties:
        customSql:
          type: string
          nullable: true
        customMetricUnitType:
          type: string
          description: Overrides the display type in the metaplane UI. Default to float if not specified. Only applies to
            custom sql monitors
          nullable: true
          enum:
          - INT
          - FLOAT
          - PERCENT
          - SECOND
          - BYTE
          - MILLISECOND
        incrementalClause:
          $ref: '#/components/schemas/PublicIncrementalClause'
        customWhereClause:
          type: string
          nullable: true
        alertRule:
          $ref: '#/components/schemas/PublicAlertRule'
        groupByColumns:
          type: array
          description: List of columns to group query by
          nullable: true
          items:
            type: string
            description: List of columns to group query by
            nullable: true
        timeZone:
          type: string
          description: 'Timezone identifier like: America/New_York'
          nullable: true
      nullable: true
    MonitorEgg:
      type: object
      properties:
        type:
          type: string
          enum:
          - ROW_COUNT
          - COLUMN_COUNT
          - CARDINALITY
          - UNIQUENESS
          - NULLNESS
          - PERCENT_ZERO
          - PERCENT_NEGATIVE
          - MIN
          - MAX
          - MEAN
          - STDDEV
          - FRESHNESS
          - CUSTOM
          - PUSH
          - SUM
          - DURATION
          - GENERIC_OBJECT
        cronTab:
          type: string
        config:
          $ref: '#/components/schemas/MonitorConfig'
        connectionId:
          type: string
          format: uuid
        entityType:
          type: string
          enum:
          - TABLE
          - COLUMN
          - DATABASE
          - SCHEMA
        absolutePathString:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    PublicTagDefinition:
      type: object
      properties:
        tagId:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    TagDefinitionRequest:
      type: object
      properties:
        names:
          uniqueItems: true
          type: array
          items:
            type: string
    PublicEntity:
      type: object
      properties:
        type:
          type: string
          enum:
          - TABLE
          - COLUMN
          - DATABASE
          - SCHEMA
        absolutePath:
          type: string
          description: Path of entity type delimited by `.`
    TaggedObjectResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicEntity'
        nextPageToken:
          type: string
          nullable: true
        hasMore:
          type: boolean
    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
          - AIRFLOW
          - BIGQUERY
          - CLICKHOUSE
          - DBT
          - DBT_CORE
          - LOOKER
          - METABASE
          - MODE
          - MYSQL
          - POSTGRES
          - REDSHIFT
          - SIGMA
          - SNOWFLAKE
          - SNOWFLAKE_DATA_APP
          - TABLEAU
          - SQLSERVER
          - POWERBI
          - FIVETRAN
          - DATABRICKS
          - DATABRICKS_HMS
          - CENSUS
          - HIGHTOUCH
          - SEGMENT
          - AIRBYTE
          - HEX
          - USER_DEFINED
        isEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - DELETED
    ConnectionSyncStatusResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - STARTED
          - SUCCEEDED
          - ERRORED
        errorMessage:
          type: string
        connectionId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    AnnotatedPoint:
      type: object
      properties:
        annotationType:
          type: string
          enum:
          - FALSE_POSITIVE
          - FALSE_NEGATIVE
          - EXPECTED_OCCASIONALLY
          - NEW_BASELINE
          - TRUE_POSITIVE
        annotatedTimestamp:
          type: string
          format: date-time
        annotatingUserEmail:
          type: string
      description: Optional annotation that was applied to this specific datapoint
      nullable: true
    EvaluationHistoryRequest:
      type: object
      properties:
        groupings:
          uniqueItems: true
          type: array
          description: Optional, only needed if you want the history for a specific group of a group by monitor
          nullable: true
          items:
            $ref: '#/components/schemas/LabelNameValue'
        createdAt:
          type: string
          description: Leaving empty gets starts at the most recent evaluation
          format: date-time
          nullable: true
        sortOrder:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
        limit:
          type: integer
          description: How many records to return. Max number per page is 500
          format: int32
          nullable: true
          default: 500
    MonitorStatus:
      type: object
      properties:
        result:
          type: number
          format: double
          nullable: true
        lowerBound:
          type: number
          format: double
          nullable: true
        upperBound:
          type: number
          format: double
          nullable: true
        predicted:
          type: number
          format: double
          nullable: true
        passed:
          type: boolean
          nullable: true
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          nullable: true
          enum:
          - PASS
          - FAIL
          - IN_TRAINING
          - FAILED_TO_PREDICT
          - NOT_ENOUGH_DATA
          - ERROR
          - INVALID_INPUT
        openRelatedIncidents:
          uniqueItems: true
          type: array
          description: A list of currently active incidents
          items:
            type: integer
            description: A list of currently active incidents
            format: int64
        errorMessage:
