openapi: 3.1.0
info:
  title: Metaplane Connections Datapoints API
  description: 'Metaplane is a data observability platform providing automated anomaly

    detection and data quality monitoring. The REST API exposes operations

    over connections, monitors, monitor evaluations, datapoints, and tags.

    '
  version: '1.0'
  contact:
    name: Metaplane
    url: https://docs.metaplane.dev/
servers:
- url: https://api.metaplane.dev
  description: Production API
security:
- apiKeyAuth: []
tags:
- name: Datapoints
paths:
  /ingestdatapoint:
    post:
      tags:
      - Datapoints
      summary: Submit a datapoint to a monitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                monitorId:
                  type: string
                value:
                  type: number
                timestamp:
                  type: string
                  format: date-time
      responses:
        '202':
          description: Datapoint ingested
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Metaplane API key
