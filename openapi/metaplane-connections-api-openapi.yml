openapi: 3.0.1
info:
  title: Metaplane Connections API
  description: 'The Connections API from Metaplane — 4 operation(s) for connections. Data observability: automated anomaly
    detection and data quality monitoring.'
  version: '1.0'
  contact:
    name: Metaplane
    url: https://docs.metaplane.dev/reference/getting-started
servers:
- url: https://dev.api.metaplane.dev
security:
- Authorization: []
tags:
- name: Connections
paths:
  /v1/connections:
    get:
      tags:
      - Connections
      summary: List all
      description: List all connections
      operationId: getAllConnections
      parameters:
      - name: includeDeleted
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
  /v1/connections/{connectionId}/sync/status:
    get:
      tags:
      - Connections
      summary: Sync status
      description: Get the current sync status of a connection
      operationId: getConnectionStatus
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionSyncStatusResult'
  /v1/connections/{connectionId}/sync:
    post:
      tags:
      - Connections
      summary: Sync
      description: Kicks of a task to re-sync the connection. Please note that this method returning 200 does not means the
        connection has finished syncing. You can poll the connection status api to determine when the sync has finished
      operationId: syncConnection
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
  /v1/connections/{connectionId}/update-private-key:
    post:
      tags:
      - Connections
      summary: Update private key
      description: Updates the private key for a connection to the newly passed in value.
      operationId: updatePrivateKey
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrivateKeyRequest'
        required: false
      responses:
        '200':
          description: Success
components:
  schemas:
    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
          - AIRFLOW
          - BIGQUERY
          - CLICKHOUSE
          - DBT
          - DBT_CORE
          - LOOKER
          - METABASE
          - MODE
          - MYSQL
          - POSTGRES
          - REDSHIFT
          - SIGMA
          - SNOWFLAKE
          - SNOWFLAKE_DATA_APP
          - TABLEAU
          - SQLSERVER
          - POWERBI
          - FIVETRAN
          - DATABRICKS
          - DATABRICKS_HMS
          - CENSUS
          - HIGHTOUCH
          - SEGMENT
          - AIRBYTE
          - HEX
          - USER_DEFINED
        isEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - DELETED
    ConnectionSyncStatusResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - STARTED
          - SUCCEEDED
          - ERRORED
        errorMessage:
          type: string
        connectionId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    UpdatePrivateKeyRequest:
      type: object
      properties:
        privateKey:
          type: string
        privateKeyPassphrase:
          type: string
          nullable: true
  securitySchemes:
    Authorization:
      type: apiKey
      description: Copy in your API key generated from metaplane
      name: Authorization
      in: header
